# ─── Pre-commit Configuration ──────────────────────────────────────────────
# Install: prek install --install-hooks
# Run manually: prek run --all-files

repos:
  # ── General ──────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: .devcontainer|.vscode|tsconfig.*
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.2
    hooks:
      - id: codespell
        args:
          - --quiet-level=2
        exclude_types: [csv, json, html]
        exclude: ^public/locales/

  # ── Markdown, YAML, JSON, CSS: Prettier ──────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        args: ["--print-width=100"]
        types_or: [css, yaml, markdown]

  # ── TypeScript / React: ESLint (needs npm ci) ────────────────────────────
  - repo: local
    hooks:
      - id: eslint
        name: eslint
        entry: npx eslint
        language: system
        types_or: [ts, tsx, javascript]
